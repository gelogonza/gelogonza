name: check assets

on:
  push:
    paths: ['README.md', 'assets/**', 'tools/capture/**']
  pull_request:
    paths: ['README.md', 'assets/**', 'tools/capture/**']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Pure file inspection -- no browser or ffmpeg needed, so skip the install.
      - run: node tools/capture/capture.mjs --check
